spring:
  application:
    name: portfolio-api
  jackson:
    default-property-inclusion: always
  web:
    # Validation messages in the `errors` map are always English, regardless of Accept-Language / host locale.
    locale: en
    locale-resolver: fixed
  mvc:
    problemdetails:
      enabled: false # handled by error.GlobalExceptionHandler

server:
  port: ${PORT:8080}
  forward-headers-strategy: none
  max-http-request-header-size: 16KB
  error:
    include-stacktrace: never
    include-message: never
  tomcat:
    # Upper bound on an *unread* request body Tomcat will drain after an early response (e.g. 413) before closing
    # the connection. NOT a JSON body limit: that is app.max-body-bytes (RequestSizeLimitFilter).
    max-swallow-size: 64KB
    # Applies only to application/x-www-form-urlencoded bodies (unused by this API); kept small as defense in depth.
    max-http-form-post-size: 64KB

app:
  name: portfolio-api
  version: '@project.version@'
  # Client IP used for rate limiting (ADR-002). The left-most X-Forwarded-For entry is never trusted.
  client-ip:
    # Number of trusted reverse proxies in front of the app. 0 = use the socket address (remoteAddr);
    # N > 0 = use the N-th X-Forwarded-For entry counted from the RIGHT. (APP_TRUSTED_PROXY_HOPS = ADR-002 alias.)
    trusted-hops: ${APP_CLIENT_IP_TRUSTED_HOPS:${APP_TRUSTED_PROXY_HOPS:0}}
    # Optional platform header that the client cannot forge (e.g. Fly-Client-IP). Takes precedence when present.
    header: ${APP_CLIENT_IP_HEADER:}
  # DEPRECATED: APP_TRUST_PROXY=true is treated as APP_CLIENT_IP_TRUSTED_HOPS=1 (startup WARN). Will be removed.
  trust-proxy: ${APP_TRUST_PROXY:false}
  # Max request body for every /api/** request, enforced with or without Content-Length (chunked included) → 413.
  max-body-bytes: 16384
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}
  contact:
    min-fill-time: 3s
    # true + no webhook → POST /api/contact answers 503 instead of only logging the message.
    require-delivery: ${APP_CONTACT_REQUIRE_DELIVERY:false}
    webhook:
      url: ${APP_CONTACT_WEBHOOK_URL:}
      token: ${APP_CONTACT_WEBHOOK_TOKEN:}
      timeout: 5s
    rate-limit:
      max-requests: 5
      window: 10m
      # Distinct client keys kept in memory; when full, new clients get 429 until entries expire (fail closed).
      max-tracked-keys: ${APP_RATE_LIMIT_MAX_TRACKED_KEYS:10000}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
  paths-to-match: /api/**

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %5p [%t] %logger{40} : %m%n"
  level:
    root: INFO
    dev.matheusspindola.portfolio: INFO
